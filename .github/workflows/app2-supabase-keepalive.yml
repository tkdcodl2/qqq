# 투자 앱 Supabase 자동 접속 — 무료 플랜 7일 미사용 일시정지 방지
# 위치: .github/workflows/app2-supabase-keepalive.yml
# v17.9 DB 통합 후: 포트폴리오 DB 한 곳만 접속 (공개 publishable 키라 Secrets 등록 불필요)
name: App2 Supabase keep-alive

on:
  schedule:
    - cron: "10 0 * * *"   # 매일 한국시간 오전 9시 10분
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 포트폴리오 DB 읽기
        env:
          PF_URL: https://ccvkbifztddnvodkyvzp.supabase.co
          PF_KEY: sb_publishable_jEUgyXlUiSCyPqbtXila3Q_p8Rigrnu
        run: |
          fail=0
          for t in ticker_prices market_data; do
            code=$(curl -s -o body.txt -w "%{http_code}" --max-time 30 \
              "$PF_URL/rest/v1/$t?select=*&limit=1" -H "apikey: $PF_KEY")
            echo "[포트폴리오 DB] $t → HTTP $code"; head -c 200 body.txt; echo
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
